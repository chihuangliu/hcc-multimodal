[project]
name = "hcc-multimodal"
version = "0.1.0"
description = "Multimodal learning for HCC using MRI radiomics and transcriptomics for outcome prediction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hcc_multimodal"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
